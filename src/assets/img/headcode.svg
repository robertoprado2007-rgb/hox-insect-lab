<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-labelledby="t d">
<title id="t">Gene combinations in the head</title><desc id="d">Four head segments in a row: antenna with no Hox gene, mandible with Dfd, maxilla with Dfd and pb, and labium with pb.</desc>
<rect width="640" height="300" rx="22" fill="#FFFBF2" stroke="#E6DFD0" stroke-width="2"/>
<text x="320" y="34" font-size="22" fill="#0E7C66" text-anchor="middle" font-weight="700" font-family="Nunito,Arial,sans-serif">Gene mixes make the head parts</text><rect x="24" y="60" width="136" height="150" rx="22" fill="#fff" stroke="#1F2A37" stroke-width="3"/><text x="92" y="90" font-size="19" fill="#1F2A37" text-anchor="middle" font-weight="700" font-family="Nunito,Arial,sans-serif">Antenna</text><text x="92" y="112" font-size="14" fill="#5B6676" text-anchor="middle" font-weight="600" font-family="Nunito,Arial,sans-serif">no Hox gene</text><rect x="42" y="140" width="100" height="34" rx="17" fill="none" stroke="#5B6676" stroke-width="3" stroke-dasharray="5 5"/><text x="92" y="163" font-size="15" fill="#5B6676" text-anchor="middle" font-weight="700" font-family="Nunito,Arial,sans-serif">none</text><rect x="174" y="60" width="136" height="150" rx="22" fill="#fff" stroke="#1F2A37" stroke-width="3"/><text x="242" y="90" font-size="19" fill="#1F2A37" text-anchor="middle" font-weight="700" font-family="Nunito,Arial,sans-serif">Mandible</text><text x="242" y="112" font-size="14" fill="#5B6676" text-anchor="middle" font-weight="600" font-family="Nunito,Arial,sans-serif">jaws</text><rect x="192" y="128" width="100" height="34" rx="17" fill="#1597b8"/><text x="242" y="151" font-size="17" fill="#fff" text-anchor="middle" font-weight="700" font-family="Nunito,Arial,sans-serif">Dfd</text><rect x="324" y="60" width="136" height="150" rx="22" fill="#fff" stroke="#1F2A37" stroke-width="3"/><text x="392" y="90" font-size="19" fill="#1F2A37" text-anchor="middle" font-weight="700" font-family="Nunito,Arial,sans-serif">Maxilla</text><text x="392" y="112" font-size="14" fill="#5B6676" text-anchor="middle" font-weight="600" font-family="Nunito,Arial,sans-serif">food handlers</text><rect x="342" y="128" width="100" height="34" rx="17" fill="#1597b8"/><text x="392" y="151" font-size="17" fill="#fff" text-anchor="middle" font-weight="700" font-family="Nunito,Arial,sans-serif">Dfd</text><rect x="342" y="168" width="100" height="34" rx="17" fill="#4b6bfb"/><text x="392" y="191" font-size="17" fill="#fff" text-anchor="middle" font-weight="700" font-family="Nunito,Arial,sans-serif">pb</text><rect x="474" y="60" width="136" height="150" rx="22" fill="#fff" stroke="#1F2A37" stroke-width="3"/><text x="542" y="90" font-size="19" fill="#1F2A37" text-anchor="middle" font-weight="700" font-family="Nunito,Arial,sans-serif">Labium</text><text x="542" y="112" font-size="14" fill="#5B6676" text-anchor="middle" font-weight="600" font-family="Nunito,Arial,sans-serif">lower lip</text><rect x="492" y="128" width="100" height="34" rx="17" fill="#4b6bfb"/><text x="542" y="151" font-size="17" fill="#fff" text-anchor="middle" font-weight="700" font-family="Nunito,Arial,sans-serif">pb</text><rect x="492" y="168" width="100" height="34" rx="17" fill="#18a058"/><text x="542" y="191" font-size="17" fill="#fff" text-anchor="middle" font-weight="700" font-family="Nunito,Arial,sans-serif">Scr</text><text x="320" y="250" font-size="17" fill="#1F2A37" text-anchor="middle" font-weight="700" font-family="Nunito,Arial,sans-serif">Hox genes tell each head segment what to grow</text><text x="320" y="276" font-size="15" fill="#5B6676" text-anchor="middle" font-weight="600" font-family="Nunito,Arial,sans-serif">(simplified: the real pattern has a few more details)</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 274" role="img" aria-labelledby="t d">
<title id="t">Real experiment versus model guess</title><desc id="d">Two cards. Left, with a green tick: seen in a real experiment. Right, with a question mark: the model's guess.</desc>
<rect width="640" height="274" rx="22" fill="#FFFBF2" stroke="#E6DFD0" stroke-width="2"/>
<text x="320" y="34" font-size="22" fill="#0E7C66" text-anchor="middle" font-weight="700" font-family="Nunito,Arial,sans-serif">How sure are we?</text><rect x="28" y="62" width="276" height="150" rx="22" fill="#fff" stroke="#18a058" stroke-width="5"/><circle cx="166" cy="110" r="26" fill="#18a058"/><path d="M152 110 l10 11 l20 -22" stroke="#fff" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="166" y="166" font-size="19" fill="#1F2A37" text-anchor="middle" font-weight="700" font-family="Nunito,Arial,sans-serif">Seen in a</text><text x="166" y="190" font-size="19" fill="#1F2A37" text-anchor="middle" font-weight="700" font-family="Nunito,Arial,sans-serif">real experiment</text><rect x="336" y="62" width="276" height="150" rx="22" fill="#fff" stroke="#e0a100" stroke-width="5" stroke-dasharray="12 8"/><circle cx="474" cy="110" r="26" fill="#e0a100"/><text x="474" y="123" font-size="36" fill="#1F2A37" text-anchor="middle" font-weight="700" font-family="Nunito,Arial,sans-serif">?</text><text x="474" y="166" font-size="19" fill="#1F2A37" text-anchor="middle" font-weight="700" font-family="Nunito,Arial,sans-serif">Model&#8217;s guess</text><text x="474" y="190" font-size="15" fill="#5B6676" text-anchor="middle" font-weight="600" font-family="Nunito,Arial,sans-serif">(an educated prediction)</text><text x="320" y="250" font-size="17" fill="#1F2A37" text-anchor="middle" font-weight="700" font-family="Nunito,Arial,sans-serif">Scientists check guesses with experiments</text>
</svg>

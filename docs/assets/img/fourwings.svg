<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 310" role="img" aria-labelledby="t d">
<title id="t">A fly with four wings</title><desc id="d">Left: a normal fly with two wings and two tiny knobs called halteres. Right: a fly with four wings.</desc>
<rect width="640" height="310" rx="22" fill="#FFFBF2" stroke="#E6DFD0" stroke-width="2"/>
<text x="320" y="34" font-size="21" fill="#0E7C66" text-anchor="middle" font-weight="700" font-family="Nunito,Arial,sans-serif">Switch Ubx off and the fly grows two extra wings</text><g transform="translate(150,150) scale(1.15)"><path d="M-18 18 L-24 48 L-32 62" stroke="#1F2A37" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M0 18 L-6 48 L-14 62" stroke="#1F2A37" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M18 18 L12 48 L4 62" stroke="#1F2A37" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="62" cy="6" rx="48" ry="22" fill="#8a6a4a"/><path d="M40 -14 Q44 6 40 26" stroke="#FFFBF2" stroke-width="3" fill="none"/><path d="M60 -14 Q64 6 60 26" stroke="#FFFBF2" stroke-width="3" fill="none"/><path d="M80 -14 Q84 6 80 26" stroke="#FFFBF2" stroke-width="3" fill="none"/><ellipse cx="0" cy="0" rx="30" ry="26" fill="#8a6a4a"/><circle cx="-46" cy="0" r="20" fill="#8a6a4a"/><circle cx="-52" cy="-6" r="10" fill="#c0392b"/><circle cx="-55" cy="-8" r="3" fill="#fff"/><path d="M-58 -18 q-6 -16 -16 -20" stroke="#1F2A37" stroke-width="3" fill="none" stroke-linecap="round"/><ellipse cx="22" cy="-40" rx="46" ry="15" transform="rotate(-18 22 -40)" fill="#cfe9f5" fill-opacity=".85" stroke="#4a8fb0" stroke-width="2"/><line x1="26" y1="-12" x2="32" y2="-28" stroke="#1F2A37" stroke-width="3"/><circle cx="33" cy="-30" r="5" fill="#e0a100"/></g><g transform="translate(470,150) scale(1.15)"><path d="M-18 18 L-24 48 L-32 62" stroke="#1F2A37" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M0 18 L-6 48 L-14 62" stroke="#1F2A37" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M18 18 L12 48 L4 62" stroke="#1F2A37" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="62" cy="6" rx="48" ry="22" fill="#8a6a4a"/><path d="M40 -14 Q44 6 40 26" stroke="#FFFBF2" stroke-width="3" fill="none"/><path d="M60 -14 Q64 6 60 26" stroke="#FFFBF2" stroke-width="3" fill="none"/><path d="M80 -14 Q84 6 80 26" stroke="#FFFBF2" stroke-width="3" fill="none"/><ellipse cx="0" cy="0" rx="30" ry="26" fill="#8a6a4a"/><circle cx="-46" cy="0" r="20" fill="#8a6a4a"/><circle cx="-52" cy="-6" r="10" fill="#c0392b"/><circle cx="-55" cy="-8" r="3" fill="#fff"/><path d="M-58 -18 q-6 -16 -16 -20" stroke="#1F2A37" stroke-width="3" fill="none" stroke-linecap="round"/><ellipse cx="22" cy="-40" rx="46" ry="15" transform="rotate(-18 22 -40)" fill="#cfe9f5" fill-opacity=".85" stroke="#4a8fb0" stroke-width="2"/><ellipse cx="46" cy="-34" rx="38" ry="13" transform="rotate(-6 46 -34)" fill="#cfe9f5" fill-opacity=".85" stroke="#4a8fb0" stroke-width="2"/></g><text x="150" y="262" font-size="19" fill="#1F2A37" text-anchor="middle" font-weight="700" font-family="Nunito,Arial,sans-serif">Normal fly</text><text x="150" y="284" font-size="15" fill="#5B6676" text-anchor="middle" font-weight="600" font-family="Nunito,Arial,sans-serif">2 wings + 2 tiny balance knobs</text><text x="470" y="262" font-size="19" fill="#1F2A37" text-anchor="middle" font-weight="700" font-family="Nunito,Arial,sans-serif">Ubx off</text><text x="470" y="284" font-size="15" fill="#5B6676" text-anchor="middle" font-weight="600" font-family="Nunito,Arial,sans-serif">4 wings, no knobs</text><path d="M290 150 H330" stroke="#0E7C66" stroke-width="6" stroke-linecap="round"/><path d="M318 138 L332 150 L318 162" stroke="#0E7C66" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

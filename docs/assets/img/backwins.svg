<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 276" role="img" aria-labelledby="t d">
<title id="t">The back gene wins</title><desc id="d">Two genes overlap on one body segment. The front gene Antp and the back gene Ubx are both on, and an arrow shows the back gene Ubx takes charge.</desc>
<rect width="600" height="276" rx="22" fill="#FFFBF2" stroke="#E6DFD0" stroke-width="2"/>
<text x="300" y="34" font-size="22" fill="#0E7C66" text-anchor="middle" font-weight="700" font-family="Nunito,Arial,sans-serif">When two genes meet, the back one wins</text><rect x="150" y="70" width="300" height="110" rx="26" fill="#fff" stroke="#1F2A37" stroke-width="4"/><text x="300" y="62" font-size="15" fill="#5B6676" text-anchor="middle" font-weight="600" font-family="Nunito,Arial,sans-serif">one body segment</text><rect x="168" y="92" width="170" height="30" rx="15" fill="#8cb31a"/><text x="253" y="113" font-size="15" fill="#1F2A37" text-anchor="middle" font-weight="700" font-family="Nunito,Arial,sans-serif">Antp (front gene)</text><rect x="262" y="132" width="170" height="30" rx="15" fill="#e0a100"/><text x="347" y="153" font-size="15" fill="#1F2A37" text-anchor="middle" font-weight="700" font-family="Nunito,Arial,sans-serif">Ubx (back gene)</text><path d="M480 150 H540" stroke="#0E7C66" stroke-width="7" stroke-linecap="round"/><path d="M526 134 L544 150 L526 166" stroke="#0E7C66" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="460" y="70" width="0" height="0"/><text x="300" y="222" font-size="18" fill="#1F2A37" text-anchor="middle" font-weight="700" font-family="Nunito,Arial,sans-serif">Ubx is further back, so Ubx decides this segment</text><text x="300" y="252" font-size="16" fill="#5B6676" text-anchor="middle" font-weight="600" font-family="Nunito,Arial,sans-serif">(this is why we say: the back gene wins)</text>
</svg>
